[package]
name = "super-opencode"
version = "0.2.0"
edition = "2024"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "links", "x11", "wayland"] }
rfd = "=0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
ureq = { version = "=3.4.2", features = ["json"] }
rusqlite = { version = "0.37", features = ["bundled"] }
cpal = "0.18.2"
whisper-rs = "0.16.0"
symphonia = { version = "0.6.1", features = ["all-codecs", "all-formats"] }
pdf-extract = "0.12.1"
sha2 = "0.11.1"
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }
portable-pty = "=0.9.0"
vt100 = "=0.18.1"

# The in-app browser. Linux builds open links in the default browser instead, so they don't
# need WebKitGTK.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
wry = { version = "=0.57.1", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }
