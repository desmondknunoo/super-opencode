name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, target: aarch64-apple-darwin, name: macos-arm64 }
          - { runner: macos-14, target: x86_64-apple-darwin, name: macos-x64 }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x64 }
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux-x64 }
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.1 --profile minimal --target ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev pkg-config libasound2-dev libclang-dev cmake
      - run: cargo +1.99.1 test --locked
      - run: cargo +1.99.1 build --locked --release --target ${{ matrix.target }}
      - if: runner.os == 'macOS'
        shell: bash
        run: |
          scripts/package-macos.sh target/${{ matrix.target }}/release/super-opencode dist
          ditto -c -k --sequesterRsrc --keepParent "dist/Super OpenCode.app" "dist/Super-OpenCode-${{ matrix.name }}.zip"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist
          Compress-Archive -Path 'target/${{ matrix.target }}/release/super-opencode.exe', README.md -DestinationPath 'dist/Super-OpenCode-${{ matrix.name }}.zip'
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/Super-OpenCode-${{ matrix.name }}.tar.gz" -C "target/${{ matrix.target }}/release" super-opencode -C "$GITHUB_WORKSPACE" README.md
      - uses: actions/upload-artifact@v4
        with:
          name: Super-OpenCode-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
