name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, target: aarch64-apple-darwin, name: macos-arm64 }
          - { runner: macos-14, target: x86_64-apple-darwin, name: macos-x64 }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x64 }
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux-x64 }
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.2.0' }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.1 --profile minimal --target ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev pkg-config libasound2-dev libclang-dev cmake
      - run: cargo +1.99.1 test --locked
      - run: cargo +1.99.1 build --locked --release --target ${{ matrix.target }}
      - if: runner.os == 'macOS'
        shell: bash
        run: |
          scripts/package-macos.sh target/${{ matrix.target }}/release/super-opencode dist
          hdiutil create -volname "Super OpenCode" -srcfolder "dist/Super OpenCode.app" -ov -format UDZO "dist/Super-OpenCode-${{ matrix.name }}.dmg"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/stage | Out-Null
          Copy-Item target/${{ matrix.target }}/release/super-opencode.exe dist/stage/
          Copy-Item README.md dist/stage/
          $root = (Get-Location).Path
          makensis `
            "/DSTAGE_DIR=$root\dist\stage" `
            "/DOUTFILE=$root\dist\Super-OpenCode-${{ matrix.name }}.exe" `
            "/DAPP_VERSION=$env:APP_VERSION" `
            scripts/installer.nsi
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          version="${APP_VERSION#v}"
          [[ "$version" =~ ^[0-9] ]] || version="0.2.0"
          scripts/package-linux-deb.sh "target/${{ matrix.target }}/release/super-opencode" "$version" "dist/Super-OpenCode-${{ matrix.name }}.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: Super-OpenCode-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.deb
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Super-OpenCode-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: cd dist && sha256sum *.dmg *.exe *.deb > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.deb
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
